spring.application.name=nexus
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexus}
spring.datasource.username=${DB_USERNAME:nexus}
spring.datasource.password=${DB_PASSWORD:nexus_local_only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
nexus.jwt-secret=${JWT_SECRET:local-demo-only-change-this-64-character-secret-before-deployment-123}
nexus.cors=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
nexus.seed=${SEED_DEMO:true}
server.error.include-message=never

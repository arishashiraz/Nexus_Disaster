services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexus_local_only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["nexus-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/nexus
      DB_USERNAME: nexus
      DB_PASSWORD: ${DB_PASSWORD:-nexus_local_only}
      JWT_SECRET: ${JWT_SECRET:-local-demo-only-change-this-64-character-secret-before-deployment-123}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  nexus-data:

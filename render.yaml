# Academic demonstration only: public fictional demo accounts.
services:
  - type: web
    name: nexus-india
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./deploy/Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: nexus-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nexus-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: nexus-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: nexus-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nexus-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: framework
      - key: CORS_ALLOWED_ORIGINS
        value: ""
databases:
  - name: nexus-db
    databaseName: nexus
    user: nexus
    region: singapore
    plan: free
    ipAllowList: []